# Desert Eagle — registo do item (TweakXL)
#
# Aditivo: cria Items.DesertEagle por cima do preset da Tsunami Nue, sem tocar
# em nenhum registo vanilla. Colocado em r6/tweaks/desert_eagle.yaml.
#
# Mapeamentos (ver docs/PIPELINE.md §6):
#   $base         -> preset da arma base (encontrado no .app extraído)
#   entityName    -> chave do factory.csv (aponta para o .app novo)
#   appearanceName-> aparência definida no .app (até ao primeiro sufixo)

Items.DesertEagle:
  $base: Items.Preset_Nue_Default
  entityName: desert_eagle_factory
  appearanceName: desert_eagle
  displayName: DesertEagle-Name
  localizedDescription: DesertEagle-Description
  quality: Quality.Legendary
  visualTags: [DesertEagleDefault]
  crosshair: Crosshairs.Tech_Round
  weaponAudio: wea_set_nue
  # Anula a compensação IK herdada (senão o retículo fica desalinhado do
  # impacto quando a geometria muda de forma) — ver matriz de diagnóstico.
  ikOffset: {x: 0, y: 0, z: 0}
  # Liga os modificadores balísticos ao item (sem isto ficam órfãos e a arma
  # usa os valores herdados da Nue). '+=' APPENDS to the inherited array —
  # keeps the Nue's own statModifiers intact.
  statModifiers: += [
    DesertEagle.Stats.DPS,
    DesertEagle.Stats.CycleTime,
    DesertEagle.Stats.MagazineCapacity,
    DesertEagle.Stats.ReloadTime,
    DesertEagle.Stats.EmptyReloadTime,
    DesertEagle.Stats.RecoilKickMin,
    DesertEagle.Stats.RecoilKickMax,
    DesertEagle.Stats.RecoilTime,
    DesertEagle.Stats.RecoilRecovery,
    DesertEagle.Stats.WeaponNoise,
    DesertEagle.Stats.HeadshotMultiplier,
    DesertEagle.Stats.EffectiveRange,
    DesertEagle.Stats.MaximumRange
  ]

# ---------------------------------------------------------------------------
# Calibração balística — identidade ".50 AE hand cannon"
#
# Vocabulário BaseStats verificado no wiki (Cheat Sheet: Weapon BaseStats,
# testado in-game). Os valores são o DESIGN de partida: dano por tiro alto,
# cadência baixa, recuo pesado, carregador curto. A calibração final faz-se em
# jogo com Red Hot Tools + Red CLI em watch (docs/PIPELINE.md §7).
#
# São registos próprios — NÃO se mexe nos BaseStats.X globais (afetariam todas
# as armas). O preset herda os statModifiers da Nue e estes somam-se por cima
# (Additive); para valores absolutos usar modifierType: Override ou limpar os
# modificadores da base no ajuste fino.
# ---------------------------------------------------------------------------

DesertEagle.Stats.DPS:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.DPS
  modifierType: Additive
  value: 380

DesertEagle.Stats.CycleTime:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.CycleTimeBase
  modifierType: Additive
  value: 0.45

DesertEagle.Stats.MagazineCapacity:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.MagazineCapacityBase
  modifierType: Additive
  value: 7

DesertEagle.Stats.ReloadTime:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.ReloadTimeBase
  modifierType: Additive
  value: 2.4

DesertEagle.Stats.EmptyReloadTime:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.EmptyReloadTime
  modifierType: Additive
  value: 3.2

DesertEagle.Stats.RecoilKickMin:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.RecoilKickMin
  modifierType: Additive
  value: 0.18

DesertEagle.Stats.RecoilKickMax:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.RecoilKickMax
  modifierType: Additive
  value: 0.42

DesertEagle.Stats.RecoilTime:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.RecoilTime
  modifierType: Additive
  value: 0.12

DesertEagle.Stats.RecoilRecovery:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.RecoilRecovery
  modifierType: Additive
  value: 0.35

DesertEagle.Stats.WeaponNoise:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.WeaponNoise
  modifierType: Additive
  value: 3.0

DesertEagle.Stats.HeadshotMultiplier:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.HeadshotDamageMultiplier
  modifierType: Additive
  value: 2.5

DesertEagle.Stats.EffectiveRange:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.EffectiveRange
  modifierType: Additive
  value: 35

DesertEagle.Stats.MaximumRange:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.MaximumRange
  modifierType: Additive
  value: 60
